# ============================================================
# UNCLASSIFIED OBJECT HANDLING
#
# These are precise technical statuses.
# Never classify an object as:
# unknown / other / misc / various / generic.
# ============================================================

unclassified_object_handling:

  create_index_record: true
  create_graph_node: true

  preserve:

    - environment
    - source_file

    - raw_command
    - raw_object_name
    - raw_parent_context

    - line_start
    - line_end

    - raw_block_sha256

    - discovered_properties
    - discovered_references
    - discovered_endpoints

  prohibited_labels:

    - unknown
    - other
    - others
    - misc
    - miscellaneous
    - many
    - different
    - various
    - generic

  statuses:

    unclassified_due_to_taxonomy_gap:

      description: >
        Parser recognized a valid configuration object block,
        but its raw DataPower command is not currently defined
        in datapower_objects.yaml.

      actions:
        - preserve_raw_command
        - preserve_raw_object_name
        - preserve_source_evidence
        - create_taxonomy_review_candidate


    unclassified_due_to_parent_context_gap:

      description: >
        Command exists in the taxonomy but the observed parent
        context does not match any currently defined context.

      actions:
        - preserve_raw_command
        - preserve_raw_parent_context
        - preserve_source_evidence
        - create_taxonomy_review_candidate


    unclassified_due_to_parser_gap:

      description: >
        Configuration syntax appears to contain an object,
        but the parser cannot reliably determine the complete
        object block or nesting boundaries.

      actions:
        - preserve_raw_lines
        - preserve_source_evidence
        - create_parser_review_candidate


    unclassified_due_to_ambiguous_command:

      description: >
        Raw command matches more than one canonical object type
        and the available context is insufficient to resolve
        the canonical classification safely.

      actions:
        - preserve_all_candidate_types
        - preserve_raw_command
        - preserve_parent_context
        - preserve_source_evidence
        - create_taxonomy_review_candidate


    unclassified_due_to_missing_object_name:

      description: >
        Object block was detected but no reliable object name
        could be extracted using the configured naming rule.

      actions:
        - preserve_raw_command
        - preserve_source_evidence
        - generate_temporary_evidence_id


# ============================================================
# CLASSIFICATION OUTPUT CONTRACT
# ============================================================

classification_output:

  required_fields:

    - object_id

    - environment
    - source_file

    - raw_command
    - raw_object_name
    - raw_parent_context

    - canonical_type
    - category

    - classification_status
    - classification_reason
    - classification_rule

    - line_start
    - line_end

    - sensitivity_level

    - indexing_policy

    - index_object
    - index_properties

    - searchable
    - graph_node

    - extract_properties
    - extract_references
    - extract_relationships
    - extract_endpoints

    - resolve_references
    - resolve_relationships

    - compare_across_environments

    - test_discovery_relevant
    - modernization_analysis_relevant

    - codegraph_candidate

    - retain_source_evidence
    - retain_raw_block_hash

    - raw_block_sha256


  classified_status:
    value: classified


  stable_object_id:

    format: >
      obj:{environment}:{canonical_type}:{normalized_object_name}


  unclassified_stable_object_id:

    format: >
      obj:{environment}:{classification_status}:{raw_command}:{normalized_object_name}

# ============================================================
# REFERENCE RESOLUTION RULES
# ============================================================

reference_resolution:

  require_source_evidence: true

  preserve_raw_reference: true
  preserve_normalized_reference: true

  preserve_reference_scheme: true

  resolve_against_file_inventory: true

  unresolved_reference_behavior:

    create_reference_record: true

    classification_status:
      unresolved_due_to_missing_target

    preserve:
      - source_object_id
      - raw_reference
      - reference_type
      - source_file
      - source_line


# ============================================================
# RELATIONSHIP RESOLUTION RULES
# ============================================================

relationship_resolution:

  require_source_evidence: true

  infer_from_name_only: false

  preserve_property_name: true
  preserve_property_value: true

  preserve_source_file: true
  preserve_source_line: true

  unresolved_target_behavior:

    create_relationship_record: true

    classification_status:
      unresolved_due_to_missing_target

  ambiguous_target_behavior:

    create_relationship_record: true

    classification_status:
      unresolved_due_to_ambiguous_target

    preserve_all_candidates: true


# ============================================================
# TAXONOMY REVIEW OUTPUT
# ============================================================

taxonomy_review:

  enabled: true

  generate_candidates_for:

    - unclassified_due_to_taxonomy_gap
    - unclassified_due_to_parent_context_gap
    - unclassified_due_to_parser_gap
    - unclassified_due_to_ambiguous_command
    - unclassified_due_to_missing_object_name

  group_candidates_by:

    - raw_command
    - raw_parent_context

  preserve_occurrence_count: true

  preserve_example_evidence: true

  preserve_all_source_locations: true


# ============================================================
# VALIDATION RULES
# ============================================================

validation:

  fail_on_duplicate_canonical_type: true

  fail_on_duplicate_match_rule_with_same_context: true

  fail_on_missing_category: true
  fail_on_undefined_category: true

  fail_on_missing_sensitivity: true

  fail_on_undefined_external_sensitivity_level: true

  sensitivity_taxonomy_source:
    path: taxonomy/sensitivity.yaml
    key: sensitivity_levels

  fail_on_missing_indexing_policy: true
  fail_on_undefined_indexing_policy: true

  fail_on_undefined_reference_type: true

  reference_taxonomy_source:
    path: taxonomy/reference_types.yaml
    key: reference_types

  fail_on_undefined_relationship_type: true

  relationship_taxonomy_source:
    path: taxonomy/relationship_types.yaml
    key: relationships

  fail_on_prohibited_classification_label: true

  allow_unclassified_objects: true

  require_unclassified_reason: true
  require_source_evidence_for_unclassified: true

  require_source_evidence_for_relationships: true
  require_source_evidence_for_references: true

  prohibit_relationship_inference_from_object_name_only: true