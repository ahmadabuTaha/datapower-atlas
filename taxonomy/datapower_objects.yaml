non_object_configuration_modes:
  crypto:
    command:
      tokens:
      - crypto
    classification: structural_parent_context
    create_logical_object: false
    purpose: 'Parent configuration mode for crypto resources. Preserve it in parent_context but do not emit a `crypto` object
      node.

      '
  documentcache:
    command:
      tokens:
      - documentcache
      bound_argument: 1
    classification: attached_subconfiguration
    create_logical_object: false
    bound_to_type: xml_manager
    capture_as_subcontext: true
    purpose: Preserve document-cache settings under the owning XML manager; do not emit an independent architecture object.
