version: 3.0-beta
taxonomy_name: datapower_objects
status: architecture_beta_object_classifier_with_lossless_property_capture
description: Architecture-relevant canonical vocabulary for recognizing IBM DataPower configuration objects in CLI .cfg exports.
  The taxonomy classifies objects needed for As-Is architecture and functional replacement analysis. Fine-grained configuration
  statements remain properties and are preserved losslessly by the parser.
design_principles:
  raw_cfg_is_authoritative: true
  ibm_cli_documentation_is_grammar_authority: true
  object_identity_separate_from_relationship_semantics: true
  properties_are_not_objects: true
  configuration_modes_are_not_automatically_objects: true
  aliases_must_be_evidence_backed: true
  parent_context_is_part_of_identity_when_required: true
  compound_commands_must_be_matched_as_compound_commands: true
  preserve_repeated_occurrences: true
  do_not_infer_relationships_from_names: true
  freeze_passed_pipeline_layers_unless_contradicted: true
  architecture_beta_scope: true
  preserve_all_object_properties_losslessly: true
  object_taxonomy_is_not_complete_cli_encyclopedia: true
  observed_export_aliases_are_valid_evidence: true
documentation_basis:
  product: IBM DataPower Gateway
  primary_version_family: 10.6.x
  secondary_semantic_check: 11.0.0
  verified_date: '2026-09-18'
  authority_order:
  - IBM DataPower CLI command reference
  - Observed raw CFG evidence from project exports
  - Parser discovery evidence
  note: 'A command is promoted to object grammar only when IBM documentation describes it as creating/modifying a configuration
    object or entering a named configuration-object mode, or when raw CFG evidence plus IBM documentation jointly establish
    that interpretation.

    '
external_taxonomies:
  sensitivity:
    path: taxonomy/sensitivity.yaml
  references:
    path: taxonomy/reference_types.yaml
  relationships:
    path: taxonomy/relationship_types.yaml
parser_contract:
  syntax: datapower_cli_configuration
  block_terminator: exit
  command_case_sensitive: false
  object_name_case_sensitive: true
  preserve:
  - source_file
  - start_line
  - end_line
  - raw_block_sha256
  - raw_command
  - raw_object_name
  - parent_context
  - occurrence_id
  - parser_version
  conditional_directives:
    recognized:
    - '%if%'
    - '%endif%'
    treat_as_object: false
  comments:
    prefixes:
    - '#'
    treat_as_object: false
  property_capture: lossless
  property_output_fields:
  - property_name
  - property_value
  - property_path
  - subcontext
  - raw_statement
  - raw_statement_sha256
  - source_line
  unclassified_definition: Only top-level statements that cannot be assigned to an object, structural context, or recognized
    control statement.
recognition_kinds:
  global_named_object:
    description: 'A named configuration object entered directly from global configuration mode.

      '
    graph_node: true
  contextual_named_object:
    description: 'A named configuration object whose CLI declaration is valid as an object only inside a documented parent
      mode. The parent context is mandatory for safe recognition because the same token can be a property elsewhere.

      '
    graph_node: true
  compound_global_named_object:
    description: 'A named configuration object whose entry command consists of multiple tokens. The parser must match the
      full command prefix, not only the first token.

      '
    graph_node: true
  global_singleton_configuration:
    description: 'A singleton global configuration mode. It can be indexed as a configuration node but has no user-supplied
      object name.

      '
    graph_node: true
  attached_subconfiguration:
    description: 'A configuration mode attached to another named object. It must not create an independent logical object
      unless downstream requirements explicitly model it as a subconfiguration node.

      '
    graph_node: false
  inline_named_object:
    description: A named configuration object declared completely on one CLI line with positional arguments.
    graph_node: true
