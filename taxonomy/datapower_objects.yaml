verification_queue:
- previous_canonical_type: crypto_profile
  reason: 'Legacy DataPower generations use crypto profile concepts, but the primary project CFG and current TLS profile grammar
    must be checked before enabling an object mapping.

    '
- previous_canonical_type: ssl_proxy_profile
  reason: 'Do not equate TLS proxy (`sslforwarder`) with a profile object without evidence from the target firmware/export
    syntax.

    '
- previous_canonical_type: web_application_firewall
  reason: verify exact command and firmware availability before enabling
- previous_canonical_type: b2b_gateway
  reason: verify exact command against target firmware/export
- previous_canonical_type: b2b_profile
  reason: IBM documents b2b-profile; enable when project evidence requires it
- previous_canonical_type: schema_exception_map
  reason: verify exact CLI object command before enabling
- previous_canonical_type: ftp_source_protocol_handler
  reason: 'Do not synthesize `source-ftp`; DataPower front-side service handlers documented for MPGW include source-http/source-https/source-mq/source-raw.

    '
- previous_canonical_type: sftp_source_protocol_handler
  reason: verify exact front-side handler object, if present in raw export
- previous_canonical_type: tcp_source_protocol_handler
  reason: 'Distinguish raw/stateful TCP handlers from a descriptive `source-tcp` alias before enabling.

    '
- previous_canonical_type: log_label
  reason: verify whether this is an independent named object in target firmware
- previous_canonical_type: web_management
  reason: verify exact CLI mode and singleton behavior in target firmware
classification_statuses:
  classified:
    meaning: matched verified grammar and required context
  unclassified_due_to_taxonomy_gap:
    meaning: valid object-like block observed but no verified taxonomy rule exists
  unclassified_due_to_parent_context_gap:
    meaning: command token known but required parent context is missing or different
  unclassified_due_to_ambiguous_command:
    meaning: token has object and property meanings and context is insufficient
  unclassified_due_to_parser_gap:
    meaning: object boundary or nesting could not be determined reliably
  unclassified_due_to_missing_object_name:
    meaning: verified named-object command found but name could not be extracted
classification_output:
  required_fields:
  - object_id
  - occurrence_id
  - environment
  - source_file
  - start_line
  - end_line
  - raw_block_sha256
  - raw_command
  - raw_object_name
  - parent_context
  - canonical_type
  - category
  - recognition_kind
  - classification_status
  - classification_reason
  - parser_version
identity:
  logical_object_id: obj:{environment}:{canonical_type}:{normalized_name}
  occurrence_id: occ:{environment}:{source_file}:{start_line}:{end_line}
  preserve_all_occurrences: true
  deduplicate_physical_evidence: false
