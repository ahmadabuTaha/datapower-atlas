        allowed:
        - request
        - response
    ibm_term: processing rule
    project_status: observed_after_parser_fix
    parser_priority: high
    notes:
    - 'Global `rule` creates/enters a reusable processing-rule object. Inside stylepolicy mode, `rule`, `request-rule`, `response-rule`,
      `error-rule`, and `match` can instead assign or create policy-specific rule associations. Context therefore matters.

      '
    declaration_form: block
    architecture_relevance: core
    capture_properties: all
