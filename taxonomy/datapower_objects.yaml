version: "1.1"

taxonomy_name: datapower_objects

description: >
  Canonical taxonomy for IBM DataPower configuration objects discovered
  from CLI .cfg exports. This taxonomy is the authoritative source for
  DataPower object classification, parsing, dependency discovery,
  test discovery, modernization analysis, environment comparison,
  Codex retrieval, skills, plans, and graph construction.

# ============================================================
# EXTERNAL TAXONOMY SOURCES
# ============================================================

taxonomy_sources:

  sensitivity:
    path: taxonomy/sensitivity.yaml
    key: sensitivity_levels

  relationships:
    path: taxonomy/relationship_types.yaml
    key: relationships

  references:
    path: taxonomy/reference_types.yaml
    key: reference_types

# ============================================================
# GLOBAL PARSER RULES
# ============================================================

parser_rules:

  syntax:
    type: datapower_cli_configuration

  object_boundary:
    strategy: cli_block
    block_terminator: exit

  preserve_source_evidence: true
  preserve_raw_command: true
  preserve_raw_object_name: true
  preserve_parent_context: true
  preserve_line_range: true
  preserve_raw_block_sha256: true

  conditional_directives:

    recognized:
      - "%if%"
      - "%endif%"

    treat_as_object: false
    preserve_as_evidence: true

  comments:

    prefixes:
      - "#"

    treat_as_configuration: false
    preserve_as_evidence: true

  normalization:

    command_case_sensitive: false
    object_name_case_sensitive: true

    trim_surrounding_whitespace: true
    preserve_original_case: true
    preserve_original_command: true
    preserve_original_object_name: true

  nesting:

    track_parent_context: true
    track_nested_exit_depth: true
    preserve_context_stack: true

# ============================================================
# STANDARD FLAGS
#
# These flags describe indexing / graph behavior.
# Sensitivity behavior comes from sensitivity.yaml.
# ============================================================

standard_flags:

  defaults:

    index_object: true
    index_properties: true

    searchable: true
    graph_node: true

    extract_properties: true
    extract_references: true
    extract_relationships: true
    extract_endpoints: true

    compare_across_environments: true

    test_discovery_relevant: true
    modernization_analysis_relevant: true

    codegraph_candidate: false

    retain_source_evidence: true
    retain_raw_block_hash: true

    resolve_references: true
    resolve_relationships: true

    taxonomy_review_required: false

# ============================================================
# INDEXING POLICIES
# ============================================================

indexing_policies:

  full:

    index_object: true
    index_properties: true

    raw_content_policy: full


  normalized:

    index_object: true
    index_properties: true

    raw_content_policy: normalized_only


  metadata_only:

    index_object: true
    index_properties: false

    raw_content_policy: metadata_only


  redacted:

    index_object: true
    index_properties: true

    raw_content_policy: redacted

# ============================================================
# OBJECT CATEGORIES
# ============================================================

categories:

  domain_configuration:
    description: >
      DataPower domain-level configuration and domain behavior.

  service:
    description: >
      Runtime DataPower gateway or proxy service.

  processing:
    description: >
      Processing policy, rule, matching rule, or processing action.

  protocol_handler:
    description: >
      Front-side or transport protocol handler.

  routing:
    description: >
      Routing, rewriting, load balancing, destination, or backend control.

  xml_processing:
    description: >
      XML manager, schema, resolver, transformation, or document processing.

  api_configuration:
    description: >
      API and gateway-specific configuration.

  security:
    description: >
      Authentication, authorization, AAA, identity, or security policy.

  tls:
    description: >
      TLS client, TLS server, or SSL proxy configuration.

  cryptographic_object:
    description: >
      Certificate, key, identification credential, validation credential,
      or cryptographic profile.

  credential_management:
    description: >
      Password aliases, secret aliases, and credential references.

  network:
    description: >
      DNS, host aliases, network interfaces, routing, or network settings.

  mq:
    description: >
      IBM MQ connectivity, queue manager, or MQ protocol configuration.

  logging_monitoring:
    description: >
      Logging, monitoring, audit, probe, or event configuration.

  user_agent:
    description: >
      DataPower user-agent and outbound connection behavior.

  file_management:
    description: >
      Filesystem or storage-related configuration.

  caching:
    description: >
      Document cache or caching policy configuration.

  database:
    description: >
      SQL or database connectivity configuration.

  b2b:
    description: >
      B2B gateways, partner profiles, or B2B-specific configuration.

  web_services:
    description: >
      SOAP, WSDL, and web-service-specific configuration.

  management:
    description: >
      DataPower management-plane services and configuration.

  access_control:
    description: >
      ACL or access-control policy configuration.

  operational:
    description: >
      Runtime or operational DataPower configuration.

# ============================================================
# OBJECT TYPES
# ============================================================

object_types:

  # ==========================================================
  # DOMAIN CONFIGURATION
  # ==========================================================

  domain_settings:

    canonical_type: domain_settings
    category: domain_configuration

    match:
      commands:
        - domain-settings

    naming:
      mode: singleton
      generated_name: domain-settings

    sensitivity: internal_configuration
    indexing_policy: normalized

    flags:
      test_discovery_relevant: false
      modernization_analysis_relevant: true
      extract_endpoints: false


  # ==========================================================
  # CREDENTIAL MANAGEMENT
  # ==========================================================

  password_alias:

    canonical_type: password_alias
    category: credential_management

    match:
      commands:
        - password-alias

    naming:
      mode: quoted_argument

    sensitivity: credential_reference
    indexing_policy: redacted

    sensitive_properties:
      - summary
      - password
      - secret
      - value

    expected_relationships: []

    expected_references: []

    flags:
      test_discovery_relevant: false
      extract_endpoints: false


