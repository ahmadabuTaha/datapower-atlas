version: "2.0"
taxonomy_name: reference_types
status: "v2_cross_taxonomy_ready"

description: >
  Reference vocabulary used after property extraction and before relationship
  resolution. A reference records evidence that a source object/property points
  to another object, file, endpoint, or embedded semantic target.

reference_families:
  object_reference:
    description: "Reference to another DataPower configuration object."
  file_reference:
    description: "Reference to a DataPower filesystem artifact."
  endpoint_reference:
    description: "Reference to a remote or local network/resource endpoint."
  embedded_reference:
    description: "Reference embedded inside compound syntax."

reference_types:

  datapower_object_reference:
    family: object_reference
    target_identity_kind: datapower_object
    resolution_required: true

  local_file:
    family: file_reference
    schemes: ["local"]
    target_identity_kind: file
    resolution_required: false

  store_file:
    family: file_reference
    schemes: ["store"]
    target_identity_kind: file
    resolution_required: false

  temporary_file:
    family: file_reference
    schemes: ["temporary"]
    target_identity_kind: file
    resolution_required: false

  configuration_file:
    family: file_reference
    schemes: ["config"]
    target_identity_kind: file
    resolution_required: false

  xslt_file:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - xslt_stylesheet
    resolution_required: false

  gatewayscript_file:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - gateway_script_javascript
    resolution_required: false

  wsdl_file:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - wsdl_definition
    resolution_required: false

  xsd_file:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - xsd_schema
    resolution_required: false

  public_certificate_file:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - pem_certificate_or_key_material
      - cer_certificate
    sensitivity_expectation:
      maximum: certificate_public_material
    resolution_required: false

  certificate_file:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - pem_certificate_or_key_material
      - cer_certificate
    resolution_required: false

  private_key_file:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - pem_certificate_or_key_material
    sensitivity_expectation:
      minimum: private_key_material
    raw_content_indexing_allowed: false
    resolution_required: false

  mq_client_configuration:
    family: file_reference
    target_identity_kind: file
    expected_file_types:
      - mq_client_ini
      - ini_configuration
    resolution_required: false

  backend_endpoint:
    family: endpoint_reference
    target_identity_kind: endpoint
    endpoint_role: backend
    resolution_required: false

  remote_resource_endpoint:
    family: endpoint_reference
    target_identity_kind: endpoint
    endpoint_role: remote_resource
    resolution_required: false

  mq_endpoint:
    family: endpoint_reference
    target_identity_kind: endpoint
    endpoint_role: messaging
    resolution_required: false

  embedded_matching_rule_reference:
    family: embedded_reference
    target_identity_kind: datapower_object
    target_type: matching_rule
    resolution_required: true

  embedded_processing_rule_reference:
    family: embedded_reference
    target_identity_kind: datapower_object
    target_type: processing_rule
    resolution_required: true

resolution_statuses:
  - pending
  - resolved_exact
  - resolved_normalized
  - resolved_file_inventory
  - endpoint_parsed
  - unresolved_target_not_found
  - unresolved_ambiguous_target
  - unresolved_due_to_missing_context
  - unresolved_due_to_taxonomy_gap
  - invalid_reference_value

output_contract:
  required_fields:
    - reference_id
    - source_object_id
    - source_occurrence_id
    - source_type
    - source_name
    - property_name
    - raw_reference
    - reference_type
    - target_name
    - target_type_hint
    - source_line
    - evidence_file
    - evidence_hash
    - resolution_status
