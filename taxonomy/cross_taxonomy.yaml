version: '1.0'
taxonomy_name: cross_taxonomy
status: v1_executable_semantic_mapping
description: 'Executable mappings joining DataPower object types, property semantics, reference types, relationship types,
  endpoint types, and resolution strategy. This file is the authoritative bridge used by the Reference Extractor and Relationship
  Resolver.

  '
dependencies:
  objects: taxonomy/datapower_objects.yaml
  properties: taxonomy/datapower_properties.yaml
  references: taxonomy/reference_types.yaml
  relationships: taxonomy/relationship_types.yaml
  endpoints: taxonomy/endpoint_types.yaml
  files: taxonomy/file_types.yaml
  sensitivity: taxonomy/sensitivity.yaml
resolution_strategies:
  same_domain_exact_name:
    normalize_name: false
    domain_scope: same_domain
    require_unique_target: true
  same_domain_exact_name_multi_type:
    normalize_name: false
    domain_scope: same_domain
    require_unique_target: true
    target_type_from_allowed_set: true
  file_inventory_lookup:
    domain_scope: same_export
    normalize_datapower_uri: true
  endpoint_parse:
    domain_scope: none
mappings:
- mapping_id: mpgw_stylepolicy
  source_type: multi_protocol_gateway
  property_name: stylepolicy
  property_kind: object_reference
  reference_type: datapower_object_reference
  target_type: style_policy
  relationship_type: uses_processing_policy
  resolution_strategy: same_domain_exact_name
- mapping_id: mpgw_xml_manager
  source_type: multi_protocol_gateway
  property_name: xml-manager
  property_kind: object_reference
  reference_type: datapower_object_reference
  target_type: xml_manager
