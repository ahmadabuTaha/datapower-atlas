version: '2.0'
taxonomy_name: relationship_types
status: v2_cross_taxonomy_ready
description: 'Semantic directed edges between DataPower configuration objects, files, endpoints, and logical resources. Relationships
  must be emitted only when supported by extracted property/reference evidence.

  '
global_rules:
  directional: true
  evidence_required: true
  infer_from_object_name: false
  infer_from_naming_pattern: false
  preserve_source_property: true
semantic_families:
  dependency:
    description: Source depends on or uses target.
  containment:
    description: Source structurally contains or owns target behavior.
  execution:
    description: Source executes code/artifact.
  routing:
    description: Source routes traffic/data to target.
  file_reference:
    description: Source references a file artifact.
  security:
    description: Source depends on security/crypto configuration.
  messaging:
    description: Source uses messaging infrastructure.
relationship_types:
  uses_processing_policy:
    family: dependency
    allowed_sources:
    - multi_protocol_gateway
    - xml_firewall
    - web_service_proxy
    allowed_targets:
    - style_policy
    - web_service_proxy_processing_policy
  contains_processing_rule:
    family: containment
    allowed_sources:
    - style_policy
    - web_service_proxy_processing_policy
    allowed_targets:
    - processing_rule
    - web_service_proxy_processing_rule
  contains_processing_action:
    family: containment
    allowed_sources:
    - processing_rule
    allowed_targets:
    - processing_action
  uses_matching_rule:
    family: dependency
    allowed_sources:
    - style_policy
    - processing_rule
    - web_service_proxy_processing_policy
    allowed_targets:
    - matching_rule
  uses_xml_manager:
    family: dependency
    allowed_sources:
    - multi_protocol_gateway
    - xml_firewall
    - web_service_proxy
    allowed_targets:
    - xml_manager
  uses_user_agent:
    family: dependency
    allowed_sources:
    - multi_protocol_gateway
    - xml_manager
    allowed_targets:
    - user_agent
  uses_load_balancer_group:
    family: dependency
    allowed_sources:
    - xml_manager
    - user_agent
    allowed_targets:
    - load_balancer_group
  uses_front_side_handler:
    family: dependency
    allowed_sources:
    - multi_protocol_gateway
    - xml_firewall
    - web_service_proxy
    - web_service_proxy_endpoint_rewrite
    allowed_targets:
    - http_source_protocol_handler
    - https_source_protocol_handler
    - mq_source_protocol_handler
    - raw_source_protocol_handler
  uses_tls_client_profile:
    family: security
    allowed_sources:
    - multi_protocol_gateway
    - processing_action
    - user_agent
    - mq_queue_manager_legacy
    - mq_v9_queue_manager
    - sql_data_source
    - web_service_proxy
    allowed_targets:
    - tls_client_profile
  uses_tls_server_profile:
    family: security
    allowed_sources:
    - http_source_protocol_handler
    - https_source_protocol_handler
    - multi_protocol_gateway
    - xml_firewall
    - web_service_proxy
    allowed_targets:
    - tls_server_profile
  uses_crypto_identification_credentials:
    family: security
    allowed_sources:
    - tls_client_profile
    - tls_server_profile
    allowed_targets:
    - crypto_identification_credentials
  uses_crypto_validation_credentials:
    family: security
    allowed_sources:
    - tls_client_profile
    - tls_server_profile
    allowed_targets:
    - crypto_validation_credentials
  uses_crypto_key:
    family: security
    allowed_sources:
    - crypto_identification_credentials
    allowed_targets:
    - crypto_key
  uses_crypto_certificate:
    family: security
    allowed_sources:
    - crypto_identification_credentials
    - crypto_validation_credentials
    allowed_targets:
    - crypto_certificate
  uses_aaa_policy:
    family: security
    allowed_sources:
    - processing_action
    - multi_protocol_gateway
    - xml_firewall
    - web_service_proxy
    allowed_targets:
    - aaa_policy
  uses_sql_data_source:
    family: dependency
    allowed_sources:
    - processing_action
    allowed_targets:
    - sql_data_source
  executes_sql_via_data_source:
    family: execution
    allowed_sources:
    - processing_action
    allowed_targets:
    - sql_data_source
  executes_xslt:
    family: execution
    allowed_sources:
    - processing_action
    - style_policy
    - web_service_proxy_processing_policy
    allowed_target_kinds:
    - file
  executes_gatewayscript:
    family: execution
    allowed_sources:
    - processing_action
    allowed_target_kinds:
    - file
  references_file:
    family: file_reference
    allowed_target_kinds:
    - file
  references_certificate_file:
    family: file_reference
    allowed_sources:
    - crypto_certificate
    allowed_target_kinds:
    - file
  references_private_key_file:
    family: file_reference
    allowed_sources:
    - crypto_key
    allowed_target_kinds:
    - file
  references_mq_client_configuration:
    family: file_reference
    allowed_sources:
    - mq_queue_manager_legacy
    - mq_v9_queue_manager
    allowed_target_kinds:
    - file
  references_schema:
    family: file_reference
    allowed_sources:
    - xml_manager
    - processing_action
    allowed_target_kinds:
    - file
  references_wsdl:
    family: file_reference
    allowed_sources:
    - xml_manager
    - web_service_proxy
    - processing_action
    allowed_target_kinds:
    - file
  routes_to_backend:
    family: routing
    allowed_sources:
    - multi_protocol_gateway
    - processing_action
    - user_agent
    allowed_target_kinds:
    - endpoint
  routes_to_mq:
    family: messaging
    allowed_sources:
    - mq_queue_manager_legacy
    - mq_v9_queue_manager
    allowed_target_kinds:
    - endpoint
  uses_endpoint_rewrite_policy:
    family: routing
    allowed_sources:
    - web_service_proxy
    allowed_targets:
    - web_service_proxy_endpoint_rewrite
deprecated_relationship_aliases:
  uses_ssl_client_profile:
    replacement: uses_tls_client_profile
  uses_ssl_server_profile:
    replacement: uses_tls_server_profile
  style_policy_action_contains:
    replacement: contains_processing_action
output_contract:
  required_fields:
  - relationship_id
  - source_object_id
  - source_type
  - source_name
  - relationship_type
  - target_kind
  - target_id
  - target_type
  - target_name
  - reference_id
  - property_name
  - evidence_file
  - evidence_line
  - evidence_hash
  - resolution_status
